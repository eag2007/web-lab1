<main>
    <div class="graphics-coordinates">
        <div class="blocks graphics">
            <h2>График</h2>
            <canvas width="764" height="650" id="canvas">
            </canvas>
        </div>

        <div class="blocks coordinates">
            <h2>Проверка точки</h2>
            <div class="poles">
                <label>Координата X:</label>
                <select id="x">
                    <option>-5</option>
                    <option>-4</option>
                    <option>-3</option>
                    <option>-2</option>
                    <option>-1</option>
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
            </div>
            <div class="poles">
                <label>Координата Y:</label>
                <input type="text" placeholder="от -3 до 3" id="y">
            </div>
            <div class="poles">
                <label>Значение R:</label>
                <input type="text" placeholder="от 2 до 5" id="r">
            </div>
            <div id="logs">
            </div>
            <button id="check-button">Проверить</button>
            <button id="clear-button">Очистить</button>
        </div>
    </div>
</main>

<section>
    <div class="table">
        <h3 id="table-name">Таблица результата</h3>
        <table>
            <thead>
                <tr>
                    <th>Координата X</th>
                    <th>Координата Y</th>
                    <th>Значение R</th>
                    <th>Состояние</th>
                    <th>Время проверки</th>
                </tr>
            </thead>
            <tbody>

            </tbody>

    </div>

</section>
